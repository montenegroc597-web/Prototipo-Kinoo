# PostgreSQL con pgvector y la API de Kinoo en local, sin Supabase. Es lo mismo que usaría cualquier nube
# (Neon, AWS RDS, Google Cloud SQL, Azure, Railway, Render…).
#   docker compose -f infra/docker/compose.yml up -d db
#   DATABASE_URL=postgres://kinoo:kinoo@localhost:5432/kinoo npm run db:migrate
#   docker compose -f infra/docker/compose.yml up api
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kinoo
      POSTGRES_PASSWORD: kinoo
      POSTGRES_DB: kinoo
    ports: ["5432:5432"]
    volumes: [kinoo-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinoo"]
      interval: 5s
      retries: 10
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://kinoo:kinoo@db:5432/kinoo
      KINOO_DEV_AUTH: "1"
      PORT: "8787"
    ports: ["8787:8787"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  kinoo-db:
