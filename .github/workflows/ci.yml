name: CI

on:
  push:
    branches: [main, back/algoritmo-v2]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:site
      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
