name: CI

on:
  push:
    branches: [main, back/algoritmo-v2]
  pull_request:

jobs:
  verificar:
    # Playwright 1.56 no soporta ubuntu-latest (26.04) todavía
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Semillas SQL al día con data/
        run: npm run seed -- --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:site
      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
